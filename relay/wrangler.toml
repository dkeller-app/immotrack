name = "bail-sign-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "SESSIONS_KV", id = "2aa3714428be4566a54d46d8ebe4740c" }
]

# Pas de R2 : les PDF sont stockés dans KV (voir src/storage.js). R2 exige une carte
# bancaire à l'activation, qu'on refuse pour rester 100 % gratuit.

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# URL publique du projet Supabase (pour récupérer la clé PUBLIQUE de vérif JWT via JWKS) — non secret.
SUPABASE_URL = "https://xcbtashflclswyiyvfgn.supabase.co"
# OTP email (vérification identité signataire).
#   EMAIL_MODE = "dev"    → aucun envoi, le code est retourné/loggé (état par défaut tant qu'il n'y
#                           a pas de domaine vérifié). Tout le flux est testable ainsi.
#   EMAIL_MODE = "resend" → envoi réel via Resend. Bascule = changer cette var + redeploy.
#   EMAIL_FROM  : expéditeur. Dev/test → "onboarding@resend.dev" ; prod → "code@propryo.fr".
#   RESEND_API_KEY : SECRET, jamais ici → `npx wrangler secret put RESEND_API_KEY`.
EMAIL_MODE = "dev"
EMAIL_FROM = "onboarding@resend.dev"
# OTP_REQUIRED = "true" → /signed refuse une signature sans OTP vérifié (garde serveur, audit point 9).
# Défaut "false" pendant le staging ; flip à "true" à l'activation, AVEC EMAIL_MODE=resend + domaine.
OTP_REQUIRED = "false"

# ── SOCLE IA (dictée de l'état des lieux ; plus tard dossiers / travaux) — src/ai/ ──
# Fournisseur : Mistral AI (France, UE). L'IA est ACTIVE dès que le secret MISTRAL_API_KEY existe :
#   npx wrangler secret put MISTRAL_API_KEY
# Sans ce secret, les routes /ai/* répondent 503 ai_disabled et l'app masque la dictée.
# AI_PROVIDER : laisser ABSENT en production. "fake" (fournisseur simulé) = tests / dev seulement.
# AI_MODEL_TRANSCRIBE / AI_MODEL_STRUCTURE : surcharges éventuelles (défauts voxtral-mini-latest /
#   mistral-small-latest). AI_CONTEXT_BIAS = "true" : vocabulaire d'aide, à activer après test réel.
# Quotas PAR COMPTE ET PAR JOUR (garde-fou de coût) et taille max d'une dictée :
AI_QUOTA_AUDIO_SEC = "3600"
AI_QUOTA_CALLS = "200"
AI_AUDIO_MAX_BYTES = "10485760"

# ── ÉTAT DES LIEUX FILMÉ (vidéo + IA) — src/ai/video.js ── ÉTEINT (décision Didier 14/10/2026) ──
# La bêta tourne sur les offres GRATUITES (Supabase Free : 1 Go, 50 Mo par fichier ; Workers Free :
# 10 ms de CPU par requête). Tant que AI_VIDEO est ABSENTE : /ai/status annonce video.actif=false, la tâche
# edl-photos répond 503 video_disabled, l'app masque « Filmer la pièce ». La dictée n'est pas touchée.
# ACTIVATION (après passage à Supabase Pro + Workers Paid, SANS redéploiement de code) : poser
#   AI_VIDEO = "true"
#   AI_VIDEO_FILE_MAX_BYTES = "209715200"   # 200 Mo par fichier (défaut 50 Mo = plan gratuit)
#   AI_QUOTA_IMAGES = "2000"                # images analysées par compte et par jour (≈ 3 EDL filmés)
# dans le tableau de bord Cloudflare (Workers → bail-sign-relay → Settings → Variables), ou ici + deploy.
# ATTENTION : un `wrangler deploy` ultérieur REMPLACE les variables posées au tableau de bord par celles de
# ce fichier (sauf `wrangler deploy --keep-vars`) : reporter ces trois lignes ici au déploiement suivant.

# ── ESPACE LOCATAIRE (migration 0059 ; CDC mockups/ESPACE-LOCATAIRE) — src/espace-locataire.js, src/el-supabase.js ──
# Clé PUBLIQUE du projet (la même que l'app, js/app/supabase-config.js) : en-tête apikey des appels de l'identité technique.
SUPABASE_ANON_KEY = "sb_publishable_mu8HNkruDoElJY7QGAHW2w_5nPvfxZO"
# Identité technique du relais (compte Supabase dédié, sans espace ni SCI, inscrit dans public.el_relais) :
#   npx wrangler secret put EL_RELAIS_EMAIL
#   npx wrangler secret put EL_RELAIS_MOT_DE_PASSE
# Sans ces deux secrets, /api/el/* répond 503 el_inactif. AUCUNE clé de service (service_role) ici.
# Code à usage unique pour donner / retirer l'accord (D10) : seulement quand l'e-mail est actif (EMAIL_MODE=resend).
EL_CODE_ACCORD = "false"

# Limite de débit de l'espace locataire (par IP) — binding Workers « ratelimit ». Si l'offre du compte le refuse au
# déploiement, retirer ce bloc : la limite des jetons invalides (20 / heure / IP) et les plafonds d'écriture restent en base.
[[unsafe.bindings]]
name = "EL_RATE"
type = "ratelimit"
namespace_id = "1059"
simple = { limit = 300, period = 60 }
